# Infrastruktur development: hanya Postgres + Redis.
# App (web, api, worker) tetap dijalankan lokal lewat `make dev-*` atau dev.ps1.
# Port hanya di-bind ke 127.0.0.1 (tidak terbuka ke jaringan lokal; password dev sengaja lemah).
# Container dev lain (raqio-api-dev) tetap bisa mencapainya lewat host.docker.internal:5433.
#
#   docker compose -f deploy/compose.dev.yml up -d
#
services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: raqio
      POSTGRES_PASSWORD: raqio
      POSTGRES_DB: raqio
    ports:
      - "127.0.0.1:${PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raqio -d raqio"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
