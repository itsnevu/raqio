# Infrastruktur development: hanya Postgres + Redis.
# App (web, api, worker) tetap dijalankan lokal lewat `make dev-*`.
#
#   docker compose -f deploy/compose.dev.yml up -d
#
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: raqio
      POSTGRES_PASSWORD: raqio
      POSTGRES_DB: raqio
    ports:
      - "${PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raqio -d raqio"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
