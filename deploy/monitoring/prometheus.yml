# Prometheus untuk Raqio (profile `monitoring` di deploy/compose.yml).
# Scrape /metrics Go API lewat network `app` dengan bearer token dari file (diisi dari METRICS_TOKEN oleh entrypoint).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: raqio-api
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["api:8080"]
        labels: { service: api }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
