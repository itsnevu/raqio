# Pembaruan dependency mingguan. Minor dan patch digabung jadi satu PR per ekosistem supaya tidak banjir PR;
# major tetap PR terpisah karena biasanya butuh perubahan kode.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jakarta
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, go]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jakarta
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, web]

  - package-ecosystem: pip
    directory: /services/scraper
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jakarta
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, python]

  # base image Dockerfile (golang, distroless, node, playwright)
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
      - /services/scraper
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jakarta
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, docker]

  # image di compose produksi (caddy, postgres)
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jakarta
    groups:
      compose-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, docker]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jakarta
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, ci]
