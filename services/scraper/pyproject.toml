[project]
name = "raqio-scraper"
version = "0.1.0"
description = "Worker scraping dan riset pasar Raqio"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["hasil", ".venv"]

[tool.ruff.lint]
# Mulai dari aturan dasar (error nyata), gaya ditambah bertahap.
select = ["E", "F", "W", "B"]
ignore = ["E501", "E701", "E702", "E731", "E741", "B007", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
